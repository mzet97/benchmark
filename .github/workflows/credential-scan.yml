name: Credential Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan working tree for secrets
        run: |
          trufflehog filesystem . \
            --only-verified \
            --exclude-paths .trufflehog-exclude.txt \
            --fail

      - name: Scan git history for secrets
        run: |
          trufflehog git file://. \
            --only-verified \
            --fail

      - name: Custom credential patterns
        run: |
          echo "Scanning for common credential patterns..."

          PATTERNS=(
            'password\s*[:=]\s*["\x27][^"\x27]{4,}["\x27]'
            'secret\s*[:=]\s*["\x27][^"\x27]{4,}["\x27]'
            'api_key\s*[:=]\s*["\x27][^"\x27]{4,}["\x27]'
            'apikey\s*[:=]\s*["\x27][^"\x27]{4,}["\x27]'
            'token\s*[:=]\s*["\x27][^"\x27]{8,}["\x27]'
            'AWS_SECRET_ACCESS_KEY'
            'PRIVATE.KEY'
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            RESULTS=$(grep -rn \
              --include='*.py' --include='*.rs' --include='*.go' \
              --include='*.js' --include='*.ts' --include='*.java' \
              --include='*.kt' --include='*.cs' --include='*.dart' \
              --include='*.yaml' --include='*.yml' --include='*.json' \
              --include='*.toml' --include='*.env' \
              -E "$pattern" . 2>/dev/null \
              | grep -v 'os.environ' | grep -v 'env(' | grep -v 'getenv' \
              | grep -v '\$\{' | grep -v 'changeme' | grep -v 'example' \
              | grep -v '# TODO' | grep -v 'node_modules' | grep -v '.git/' \
              | grep -v 'test' | grep -v 'mock' | grep -v 'fake' \
              || true)

            if [ -n "$RESULTS" ]; then
              echo "::warning::Pattern '$pattern' matched:"
              echo "$RESULTS"
              FOUND=$((FOUND + 1))
            fi
          done

          if [ $FOUND -gt 0 ]; then
            echo "::error::Found $FOUND credential patterns. Credentials must come from"
            echo "::error::the environment (see scripts/purge-credentials.py). Failing the build."
            exit 1
          fi
          echo "✅ No credential patterns found"

      - name: Check .env files
        run: |
          # Ensure no .env files are committed
          ENV_FILES=$(find . -name '.env' -not -path './.git/*' -not -path './node_modules/*' 2>/dev/null || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::The following .env files are committed:"
            echo "$ENV_FILES"
            echo "Remove them and add to .gitignore"
            exit 1
          fi
          echo "✅ No .env files committed"
