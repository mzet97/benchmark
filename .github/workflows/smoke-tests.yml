name: Smoke Tests

# Validates a built REST implementation against the benchmark contract
# (contracts/rest/canonical-payloads.md), not against ad-hoc endpoints.
#
# Previously this workflow hit /api/json and /api/users?limit=1 -- endpoints the
# benchmark does not measure -- with per-language ports (3000/5000/8000). A pass
# here approved implementations against the wrong API, and a fail would reject
# implementations that correctly follow the contract (/json, /db/simple, 8080).
# See docs/ACTION_PLAN.md, Fase 8.9.
#
# The contract is enforced by scripts/validate-parity.py, the same gate the
# benchmark runner uses. gRPC and GraphQL smoke is out of scope here until the
# parity gate grows protocol support (Fase 6.11).

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Language (python, rust, go, ...) or "all"'
        required: false
        default: 'all'
      framework:
        description: 'Framework directory under src/<language>/ (e.g. fiber, actix-web)'
        required: true

env:
  PG_PASSWORD: ${{ secrets.PG_PASSWORD }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: python, framework: fastapi }
          - { language: python, framework: flask }
          - { language: python, framework: django }
          - { language: go, framework: fiber }
          - { language: go, framework: gin }
          - { language: go, framework: echo }
          - { language: go, framework: chi }
          - { language: rust, framework: actix-web }
          - { language: rust, framework: axum }
          - { language: rust, framework: rocket }
          - { language: rust, framework: warp }
          - { language: nodejs, framework: fastify }
          - { language: nodejs, framework: express }
          - { language: nodejs, framework: nestjs }
          - { language: bun, framework: elysia }
          - { language: bun, framework: hono }
          - { language: bun, framework: bun_serve }
          - { language: deno, framework: oak }
          - { language: deno, framework: hono }
          - { language: deno, framework: deno_serve }
          - { language: java, framework: spring }
          - { language: java, framework: micronaut }
          - { language: kotlin, framework: ktor }
          - { language: kotlin, framework: spring }
          - { language: kotlin, framework: http4k }
          - { language: csharp, framework: MinimalApi }

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: benchmark
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Filter
        id: filter
        run: |
          LANG_IN="${{ github.event.inputs.language }}"
          FW_IN="${{ github.event.inputs.framework }}"
          RUN="false"
          if [ "$LANG_IN" = "all" ] || [ "$LANG_IN" = "${{ matrix.language }}" ]; then
            RUN="true"
          fi
          # When a specific framework is given, only the matching matrix row runs.
          if [ -n "$FW_IN" ] && [ "$FW_IN" != "${{ matrix.framework }}" ]; then
            RUN="false"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Seed database
        if: steps.filter.outputs.run == 'true'
        run: |
          PGPASSWORD="$PG_PASSWORD" psql -h localhost -U benchmark -d benchmark \
            -f sql/01_schema.sql
          PGPASSWORD="$PG_PASSWORD" psql -h localhost -U benchmark -d benchmark \
            -f sql/02_seed.sql
          PGPASSWORD="$PG_PASSWORD" psql -h localhost -U benchmark -d benchmark \
            -f sql/03_indexes.sql

      - name: Build image
        if: steps.filter.outputs.run == 'true'
        working-directory: src/${{ matrix.language }}/${{ matrix.framework }}
        run: docker build -t benchmark/${{ matrix.language }}-${{ matrix.framework }}:smoke .

      - name: Run container
        if: steps.filter.outputs.run == 'true'
        run: |
          docker run -d \
            --name sut \
            --network host \
            -e DATABASE_URL="postgresql://benchmark:${{ env.PG_PASSWORD }}@localhost:5432/benchmark" \
            -e REDIS_URL="redis://localhost:6379" \
            -e PORT=8080 \
            -e HOST=0.0.0.0 \
            -e DB_POOL_MAX=4 \
            -e BENCH_CPUS=2 \
            benchmark/${{ matrix.language }}-${{ matrix.framework }}:smoke

      - name: Wait for startup
        if: steps.filter.outputs.run == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8080/health" > /dev/null 2>&1; then
              echo "Service is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Service did not become healthy on :8080/health within 60s"
          docker logs sut
          exit 1

      - name: Contract parity gate
        if: steps.filter.outputs.run == 'true'
        run: |
          python3 scripts/validate-parity.py --url http://localhost:8080

      - name: Logs on failure
        if: failure() && steps.filter.outputs.run == 'true'
        run: docker logs sut || true

      - name: Cleanup
        if: always()
        run: docker rm -f sut 2>/dev/null || true
