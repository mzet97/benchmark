---
# 02-create-secrets.yml
# Cria o secret benchmark-secrets no namespace benchmark.
#
# Usage: ansible-playbook playbooks/02-create-secrets.yml -e "pg_password=SENHA redis_password=SENHA"

- name: Create Benchmark Secrets
  hosts: k3s_server
  gather_facts: no
  become: yes

  vars:
    benchmark_namespace: benchmark
    pg_password: "CHANGE_ME"
    redis_password: "CHANGE_ME"
    pg_host: "spsql.home.arpa"
    pg_port: "5432"
    pg_database: "benchmark_api"
    pg_user: "app"
    redis_host: "redis.home.arpa"
    redis_port: "30379"

  tasks:
    - name: Create namespace
      shell: kubectl create namespace {{ benchmark_namespace }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Delete existing secret
      shell: kubectl delete secret benchmark-secrets -n {{ benchmark_namespace }} --ignore-not-found
      ignore_errors: yes

    - name: Create secret
      shell: |
        kubectl create secret generic benchmark-secrets \
          --namespace {{ benchmark_namespace }} \
          --from-literal=database-url="postgresql://{{ pg_user }}:{{ pg_password }}@{{ pg_host }}:{{ pg_port }}/{{ pg_database }}" \
          --from-literal=redis-url="redis://:{{ redis_password }}@{{ redis_host }}:{{ redis_port }}"

    - name: Verify secret
      shell: kubectl get secret benchmark-secrets -n {{ benchmark_namespace }} -o jsonpath='{.data}' | base64 -d
      register: secret_verify
      ignore_errors: yes

    - name: Display secret status
      debug:
        msg: "Secret created: {{ 'OK' if secret_verify.rc == 0 else 'FAILED' }}"
