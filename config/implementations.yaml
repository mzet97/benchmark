# config/implementations.yaml
# Source of truth for all benchmark implementations.
# Used by scripts and Makefile to drive build/deploy/benchmark lifecycle.
#
# Each implementation has a unique ID: <environment>-<protocol>-<framework>
# Example: rust-rest-actix-web, go-grpc-grpc-go, nodejs-graphql-mercurius

defaults:
  port: 8080
  resources:
    requests:
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  replicas: 5
  probes:
    healthz: /healthz
    readyz: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

implementations:
  # ========================================================================
  # RUST
  # ========================================================================

  # REST
