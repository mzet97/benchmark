# Overlay for dart-grpc-grpc-dart
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: dart-grpc-grpc-dart
  benchmark-protocol: grpc
  benchmark-environment: dart
  benchmark-framework: grpc-dart

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: dart-grpc-grpc-dart
      - op: replace
        path: /metadata/labels/benchmark-protocol
        value: grpc
      - op: replace
        path: /spec/selector/matchLabels/app
        value: dart-grpc-grpc-dart
      - op: replace
        path: /spec/template/metadata/labels/app
        value: dart-grpc-grpc-dart
      - op: replace
        path: /spec/template/metadata/labels/benchmark-protocol
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/dart-grpc-grpc-dart:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 50051
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/name
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: dart-grpc-grpc-dart-config
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/tcpSocket/port
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/tcpSocket/port
        value: grpc

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: dart-grpc-grpc-dart
      - op: replace
        path: /spec/selector/app
        value: dart-grpc-grpc-dart
      - op: replace
        path: /spec/ports/0/name
        value: grpc
      - op: replace
        path: /spec/ports/0/targetPort
        value: grpc

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: dart-grpc-grpc-dart-config
      - op: replace
        path: /data/PORT
        value: "50051"
