# Overlay for kotlin-grpc-spring-grpc
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../../base

commonLabels:
  app: kotlin-grpc-spring-grpc
  benchmark-protocol: grpc
  benchmark-environment: kotlin
  benchmark-framework: spring-grpc

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-grpc-spring-grpc
      - op: replace
        path: /metadata/labels/benchmark-protocol
        value: grpc
      - op: replace
        path: /spec/selector/matchLabels/app
        value: kotlin-grpc-spring-grpc
      - op: replace
        path: /spec/template/metadata/labels/app
        value: kotlin-grpc-spring-grpc
      - op: replace
        path: /spec/template/metadata/labels/benchmark-protocol
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/kotlin-grpc-spring-grpc:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 50051
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/name
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: kotlin-grpc-spring-grpc-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-grpc-spring-grpc
      - op: replace
        path: /spec/selector/app
        value: kotlin-grpc-spring-grpc
      - op: replace
        path: /spec/ports/0/name
        value: grpc
      - op: replace
        path: /spec/ports/0/targetPort
        value: grpc

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-grpc-spring-grpc-config
      - op: replace
        path: /data/PORT
        value: "50051"
