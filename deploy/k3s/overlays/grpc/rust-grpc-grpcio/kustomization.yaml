# Overlay for rust-grpc-grpcio
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../../base

commonLabels:
  app: rust-grpc-grpcio
  benchmark-protocol: grpc
  benchmark-environment: rust
  benchmark-framework: grpcio

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: rust-grpc-grpcio
      - op: replace
        path: /metadata/labels/benchmark-protocol
        value: grpc
      - op: replace
        path: /spec/selector/matchLabels/app
        value: rust-grpc-grpcio
      - op: replace
        path: /spec/template/metadata/labels/app
        value: rust-grpc-grpcio
      - op: replace
        path: /spec/template/metadata/labels/benchmark-protocol
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/rust-grpc-grpcio:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 50051
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/name
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: rust-grpc-grpcio-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: rust-grpc-grpcio
      - op: replace
        path: /spec/selector/app
        value: rust-grpc-grpcio
      - op: replace
        path: /spec/ports/0/name
        value: grpc
      - op: replace
        path: /spec/ports/0/targetPort
        value: grpc

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: rust-grpc-grpcio-config
      - op: replace
        path: /data/PORT
        value: "50051"
