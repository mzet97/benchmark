# Overlay for deno-grpc-nice-grpc
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: deno-grpc-nice-grpc
  benchmark-protocol: grpc
  benchmark-environment: deno
  benchmark-framework: nice-grpc

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: deno-grpc-nice-grpc
      - op: replace
        path: /metadata/labels/benchmark-protocol
        value: grpc
      - op: replace
        path: /spec/selector/matchLabels/app
        value: deno-grpc-nice-grpc
      - op: replace
        path: /spec/template/metadata/labels/app
        value: deno-grpc-nice-grpc
      - op: replace
        path: /spec/template/metadata/labels/benchmark-protocol
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/deno-grpc-nice-grpc:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 50051
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/name
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/tcpSocket/port
        value: grpc
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/tcpSocket/port
        value: grpc
        value: deno-grpc-nice-grpc-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: deno-grpc-nice-grpc
      - op: replace
        path: /spec/selector/app
        value: deno-grpc-nice-grpc
      - op: replace
        path: /spec/ports/0/name
        value: grpc
      - op: replace
        path: /spec/ports/0/targetPort
        value: grpc

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: deno-grpc-nice-grpc-config
      - op: replace
        path: /data/PORT
        value: "50051"
