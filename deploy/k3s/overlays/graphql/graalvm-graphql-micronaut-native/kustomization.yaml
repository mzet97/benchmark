# Overlay for graalvm-graphql-micronaut-native
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: graalvm-graphql-micronaut-native
  benchmark-protocol: graphql
  benchmark-environment: graalvm
  benchmark-framework: micronaut

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: graalvm-graphql-micronaut-native
      - op: replace
        path: /spec/selector/matchLabels/app
        value: graalvm-graphql-micronaut-native
      - op: replace
        path: /spec/template/metadata/labels/app
        value: graalvm-graphql-micronaut-native
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/graalvm-graphql-micronaut-native:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: graalvm-graphql-micronaut-native-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: graalvm-graphql-micronaut-native
      - op: replace
        path: /spec/selector/app
        value: graalvm-graphql-micronaut-native

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: graalvm-graphql-micronaut-native-config
      - op: replace
        path: /data/PORT
        value: "8080"
