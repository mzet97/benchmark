# Overlay for python-graphql-graphene
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../../base

commonLabels:
  app: python-graphql-graphene
  benchmark-protocol: graphql
  benchmark-environment: python
  benchmark-framework: graphene

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: python-graphql-graphene
      - op: replace
        path: /spec/selector/matchLabels/app
        value: python-graphql-graphene
      - op: replace
        path: /spec/template/metadata/labels/app
        value: python-graphql-graphene
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/python-graphql-graphene:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: python-graphql-graphene-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: python-graphql-graphene
      - op: replace
        path: /spec/selector/app
        value: python-graphql-graphene

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: python-graphql-graphene-config
      - op: replace
        path: /data/PORT
        value: "8080"
