# Overlay for deno-graphql-hono
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../../base

commonLabels:
  app: deno-graphql-hono
  benchmark-protocol: graphql
  benchmark-environment: deno
  benchmark-framework: hono

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: deno-graphql-hono
      - op: replace
        path: /spec/selector/matchLabels/app
        value: deno-graphql-hono
      - op: replace
        path: /spec/template/metadata/labels/app
        value: deno-graphql-hono
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/deno-graphql-hono:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: deno-graphql-hono-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: deno-graphql-hono
      - op: replace
        path: /spec/selector/app
        value: deno-graphql-hono

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: deno-graphql-hono-config
      - op: replace
        path: /data/PORT
        value: "8080"
