# Overlay for nodejs-graphql-mercurius
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: nodejs-graphql-mercurius
  benchmark-protocol: graphql
  benchmark-environment: nodejs
  benchmark-framework: mercurius

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: nodejs-graphql-mercurius
      - op: replace
        path: /spec/selector/matchLabels/app
        value: nodejs-graphql-mercurius
      - op: replace
        path: /spec/template/metadata/labels/app
        value: nodejs-graphql-mercurius
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/nodejs-graphql-mercurius:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: nodejs-graphql-mercurius-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: nodejs-graphql-mercurius
      - op: replace
        path: /spec/selector/app
        value: nodejs-graphql-mercurius

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: nodejs-graphql-mercurius-config
      - op: replace
        path: /data/PORT
        value: "8080"
