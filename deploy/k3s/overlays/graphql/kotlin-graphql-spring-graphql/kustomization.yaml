# Overlay for kotlin-graphql-spring-graphql
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: kotlin-graphql-spring-graphql
  benchmark-protocol: graphql
  benchmark-environment: kotlin
  benchmark-framework: spring-graphql

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-graphql-spring-graphql
      - op: replace
        path: /spec/selector/matchLabels/app
        value: kotlin-graphql-spring-graphql
      - op: replace
        path: /spec/template/metadata/labels/app
        value: kotlin-graphql-spring-graphql
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/kotlin-graphql-spring-graphql:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: kotlin-graphql-spring-graphql-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-graphql-spring-graphql
      - op: replace
        path: /spec/selector/app
        value: kotlin-graphql-spring-graphql

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-graphql-spring-graphql-config
      - op: replace
        path: /data/PORT
        value: "8080"
