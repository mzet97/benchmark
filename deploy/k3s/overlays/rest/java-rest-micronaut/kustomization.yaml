# Overlay for java-rest-micronaut
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: java-rest-micronaut
  benchmark-protocol: rest
  benchmark-environment: java
  benchmark-framework: micronaut

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: java-rest-micronaut
      - op: replace
        path: /spec/selector/matchLabels/app
        value: java-rest-micronaut
      - op: replace
        path: /spec/template/metadata/labels/app
        value: java-rest-micronaut
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/java-rest-micronaut:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: java-rest-micronaut-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: java-rest-micronaut
      - op: replace
        path: /spec/selector/app
        value: java-rest-micronaut

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: java-rest-micronaut-config
      - op: replace
        path: /data/PORT
        value: "8080"
