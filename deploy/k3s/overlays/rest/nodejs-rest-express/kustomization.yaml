# Overlay for nodejs-rest-express
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../../base

commonLabels:
  app: nodejs-rest-express
  benchmark-protocol: rest
  benchmark-environment: nodejs
  benchmark-framework: express

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: nodejs-rest-express
      - op: replace
        path: /spec/selector/matchLabels/app
        value: nodejs-rest-express
      - op: replace
        path: /spec/template/metadata/labels/app
        value: nodejs-rest-express
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/nodejs-rest-express:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: nodejs-rest-express-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: nodejs-rest-express
      - op: replace
        path: /spec/selector/app
        value: nodejs-rest-express

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: nodejs-rest-express-config
      - op: replace
        path: /data/PORT
        value: "8080"
