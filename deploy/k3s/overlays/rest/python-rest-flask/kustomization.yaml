# Overlay for python-rest-flask
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../../base

commonLabels:
  app: python-rest-flask
  benchmark-protocol: rest
  benchmark-environment: python
  benchmark-framework: flask

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: python-rest-flask
      - op: replace
        path: /spec/selector/matchLabels/app
        value: python-rest-flask
      - op: replace
        path: /spec/template/metadata/labels/app
        value: python-rest-flask
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/python-rest-flask:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: python-rest-flask-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: python-rest-flask
      - op: replace
        path: /spec/selector/app
        value: python-rest-flask

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: python-rest-flask-config
      - op: replace
        path: /data/PORT
        value: "8080"
