# Overlay for go-rest-echo
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../../base

commonLabels:
  app: go-rest-echo
  benchmark-protocol: rest
  benchmark-environment: go
  benchmark-framework: echo

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: go-rest-echo
      - op: replace
        path: /spec/selector/matchLabels/app
        value: go-rest-echo
      - op: replace
        path: /spec/template/metadata/labels/app
        value: go-rest-echo
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/go-rest-echo:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: go-rest-echo-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: go-rest-echo
      - op: replace
        path: /spec/selector/app
        value: go-rest-echo

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: go-rest-echo-config
      - op: replace
        path: /data/PORT
        value: "8080"
