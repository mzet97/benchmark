# Overlay for csharp-rest-minimal-api
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: csharp-rest-minimal-api
  benchmark-protocol: rest
  benchmark-environment: csharp
  benchmark-framework: minimal-api

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: csharp-rest-minimal-api
      - op: replace
        path: /spec/selector/matchLabels/app
        value: csharp-rest-minimal-api
      - op: replace
        path: /spec/template/metadata/labels/app
        value: csharp-rest-minimal-api
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/csharp-rest-minimal-api:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: csharp-rest-minimal-api-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: csharp-rest-minimal-api
      - op: replace
        path: /spec/selector/app
        value: csharp-rest-minimal-api

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: csharp-rest-minimal-api-config
      - op: replace
        path: /data/PORT
        value: "8080"
