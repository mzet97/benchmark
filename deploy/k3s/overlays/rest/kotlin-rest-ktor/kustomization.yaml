# Overlay for kotlin-rest-ktor
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: kotlin-rest-ktor
  benchmark-protocol: rest
  benchmark-environment: kotlin
  benchmark-framework: ktor

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-rest-ktor
      - op: replace
        path: /spec/selector/matchLabels/app
        value: kotlin-rest-ktor
      - op: replace
        path: /spec/template/metadata/labels/app
        value: kotlin-rest-ktor
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/kotlin-rest-ktor:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: kotlin-rest-ktor-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-rest-ktor
      - op: replace
        path: /spec/selector/app
        value: kotlin-rest-ktor

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: kotlin-rest-ktor-config
      - op: replace
        path: /data/PORT
        value: "8080"
