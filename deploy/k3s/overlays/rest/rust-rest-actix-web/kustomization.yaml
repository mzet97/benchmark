# Overlay for rust-rest-actix-web
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: rust-rest-actix-web
  benchmark-protocol: rest
  benchmark-environment: rust
  benchmark-framework: actix-web

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: rust-rest-actix-web
      - op: replace
        path: /spec/selector/matchLabels/app
        value: rust-rest-actix-web
      - op: replace
        path: /spec/template/metadata/labels/app
        value: rust-rest-actix-web
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/rust-rest-actix-web:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: rust-rest-actix-web-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: rust-rest-actix-web
      - op: replace
        path: /spec/selector/app
        value: rust-rest-actix-web

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: rust-rest-actix-web-config
      - op: replace
        path: /data/PORT
        value: "8080"
