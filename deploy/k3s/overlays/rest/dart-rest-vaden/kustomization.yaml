# Overlay for dart-rest-vaden
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

resources:
  - ../../../base

commonLabels:
  app: dart-rest-vaden
  benchmark-protocol: rest
  benchmark-environment: dart
  benchmark-framework: vaden

namePrefix: ""

patches:
  - target:
      kind: Deployment
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: dart-rest-vaden
      - op: replace
        path: /spec/selector/matchLabels/app
        value: dart-rest-vaden
      - op: replace
        path: /spec/template/metadata/labels/app
        value: dart-rest-vaden
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: benchmark/dart-rest-vaden:latest
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3000
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: dart-rest-vaden-config

  - target:
      kind: Service
      name: PLACEHOLDER
    patch: |-
      - op: replace
        path: /metadata/name
        value: dart-rest-vaden
      - op: replace
        path: /spec/selector/app
        value: dart-rest-vaden

  - target:
      kind: ConfigMap
      name: PLACEHOLDER-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: dart-rest-vaden-config
      - op: replace
        path: /data/PORT
        value: "3000"
