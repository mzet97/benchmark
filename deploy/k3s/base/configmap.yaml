# Base ConfigMap template.
# Overlays must provide implementation-specific values.

apiVersion: v1
kind: ConfigMap
metadata:
  name: PLACEHOLDER-config
  namespace: benchmark
  labels:
    app: PLACEHOLDER
data:
  PORT: "8080"
  HOST: "0.0.0.0"

  # Logging off during measurement: per-request logging is a 2-3x difference
  # between implementations and is not what this benchmark measures.
  LOG_LEVEL: "error"

  # LOG_LEVEL is not a thing any Rust crate reads. env_logger and
  # tracing_subscriber::EnvFilter read RUST_LOG, and without it the axum
  # implementation fell back to its own default of
  # "benchmark_axum=debug,tower_http=debug,axum=debug" -- so TraceLayer emitted
  # a span plus two formatted stdout events per request, which is precisely the
  # 2-3x the line above exists to prevent. The implementations no longer default
  # to debug either; this pins it from the outside as well.
  RUST_LOG: "error"

  CACHE_TTL: "300"

  # ---------------------------------------------------------------------
  # Contract-level tuning knobs (docs/ACTION_PLAN.md, Fase 3).
  # These are identical for every implementation on purpose: parallelism and
  # pool size were the two biggest hidden variables in the previous results.
  # ---------------------------------------------------------------------

  # Must match the pod's CPU limit. Runtimes that read the host CPU count
  # instead of the cgroup quota (notably Go) need this to size their thread
  # pool correctly; single-threaded runtimes (Node, Deno, Bun, Python) use it
  # to fork that many workers.
  BENCH_CPUS: "40"

  # Previously: Go REST used a single connection with no pool, Go GraphQL used
  # 10, Node/Kotlin/GraalVM used 25, Rust used the sqlx default. Sized against
  # the PostgreSQL ceiling measured in Fase 0.
  #
  # NOT YET TRUE FOR EVERY IMPLEMENTATION. An audit on 2026-08-10 found 39 of the
  # 101 implementations on disk that never read this variable -- almost all of
  # them gRPC and GraphQL, because Fase 3 fixed the pool in the REST matrix and
  # did not reach the other two protocols. Ten JVM implementations were opening a
  # *new* JDBC connection per request via DriverManager; three C# ones sit on
  # Npgsql's default MaxPoolSize of 100; python/flask has no pool at all. The
  # enumeration and the state of each is in docs/ACTION_PLAN.md, Fase 9.10.
  # Until that closes, this value governs the REST matrix and part of the rest.
  DB_POOL_MAX: "32"
  REDIS_POOL_MAX: "32"

  # ---------------------------------------------------------------------
  # Runtime parallelism, set through the environment.
  #
  # An audit of all 100 implementations found 77 with no parallelism setting
  # of any kind. In a pod with 40 CPUs that means a runtime either sizes its
  # pools from the *host* core count -- which is not the cgroup quota -- or
  # stays on one thread entirely. Either way the ranking would reward whoever
  # remembered to configure workers, not the framework.
  #
  # These four cover Go, the JVM, .NET and Tokio without touching any source
  # file. The genuinely single-threaded runtimes (Node, Deno, Bun, Python,
  # Dart) need a multi-process bootstrap in code and read BENCH_CPUS for it.
  # ---------------------------------------------------------------------

  # Go reads the host CPU count, not the cgroup quota. Since Go 1.21 the
  # runtime honours this variable, so no code change is needed.
  GOMAXPROCS: "40"

  # The JVM sizes ForkJoinPool, GC threads and most framework thread pools
  # from availableProcessors(). Container awareness gets this right for CPU
  # *limits*, but pinning it removes the doubt -- and it is the only knob that
  # works identically across Spring, Micronaut, Quarkus, Helidon and Vert.x.
  #
  # Heap and collector are here for the same reason. Not one JVM implementation
  # set -Xms/-Xmx, so each ran with the default 1/64 initial and 1/4 maximum of
  # the container limit and spent the measurement growing its heap; and four of
  # them (java/kotlin dgs, spring-graphql, graphql-kotlin) pinned G1 with a 20ms
  # pause target in their Dockerfile while the rest took the default. A pause
  # target is tuning, and tuning that only four implementations get is a ranking
  # of who edited their Dockerfile.
  #
  # Heap sized at 32g of the 40 GiB container limit (80%, leaving room for
  # non-heap). Does not reach the six GraalVM *native* images: a native
  # executable does not read JAVA_TOOL_OPTIONS.
  # See docs/ACTION_PLAN.md, Fase 3.1.
  JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=40 -Xms32g -Xmx32g -XX:+UseG1GC"

  # Same idea for .NET's thread pool and GC heap count.
  DOTNET_PROCESSOR_COUNT: "40"

  # Tokio defaults to the number of available cores, which in a container is
  # usually right; pinned so it does not depend on the runtime's detection.
  TOKIO_WORKER_THREADS: "40"
  ROCKET_WORKERS: "40"
