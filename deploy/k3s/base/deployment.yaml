# Base Deployment template.
# Overlays must provide:
#   - IMPLEMENTATION_ID (e.g., rust-rest-actix-web)
#   - IMAGE (e.g., benchmark/rust-rest-actix-web:<sha>)
#   - PORT (e.g., 8080)
#   - PROTOCOL (rest|grpc|graphql)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER
  namespace: benchmark
  labels:
    app: PLACEHOLDER
    benchmark-protocol: PLACEHOLDER
    benchmark-role: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PLACEHOLDER
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: PLACEHOLDER
        benchmark-protocol: PLACEHOLDER
        benchmark-role: server
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: app
          image: PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: PLACEHOLDER-config
            - secretRef:
                name: benchmark-secrets
                optional: true
          # requests == limits => QoS Guaranteed. Combined with the kubelet's
          # static CPU manager policy and integer CPU requests, this gives the
          # pod exclusive whole cores: no CFS throttling and no thread
          # migration between cores, which is what makes saturation
          # measurements reproducible across the 5 repetitions.
          #
          # 7 of the node's 8 vCPUs; the remaining one is reserved for K3s and
          # the OS via --system-reserved/--kube-reserved. BENCH_CPUS in the
          # ConfigMap must match the CPU value here.
          # See docs/ACTION_PLAN.md, Fase 2 and Fase 4.
          resources:
            requests:
              cpu: "7"
              memory: "12Gi"
            limits:
              cpu: "7"
              memory: "12Gi"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
