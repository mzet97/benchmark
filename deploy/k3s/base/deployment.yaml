# Base Deployment template.
# Overlays must provide:
#   - IMPLEMENTATION_ID (e.g., rust-rest-actix-web)
#   - IMAGE (e.g., benchmark/rust-rest-actix-web:<sha>)
#   - PORT (e.g., 8080)
#   - PROTOCOL (rest|grpc|graphql)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER
  namespace: benchmark
  labels:
    app: PLACEHOLDER
    benchmark-protocol: PLACEHOLDER
    benchmark-role: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PLACEHOLDER
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: PLACEHOLDER
        benchmark-protocol: PLACEHOLDER
        benchmark-role: server
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: app
          image: PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: PLACEHOLDER-config
            - secretRef:
                name: benchmark-secrets
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
