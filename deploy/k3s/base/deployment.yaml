# Base Deployment template.
# Overlays must provide:
#   - IMPLEMENTATION_ID (e.g., rust-rest-actix-web)
#   - IMAGE (e.g., benchmark/rust-rest-actix-web:<sha>)
#   - PORT (e.g., 8080)
#   - PROTOCOL (rest|grpc|graphql)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER
  namespace: benchmark
  labels:
    app: PLACEHOLDER
    benchmark-protocol: PLACEHOLDER
    benchmark-role: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PLACEHOLDER
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: PLACEHOLDER
        benchmark-protocol: PLACEHOLDER
        benchmark-role: server
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: app
          image: PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: PLACEHOLDER-config
            - secretRef:
                name: benchmark-secrets
                optional: true
          # requests == limits => QoS Guaranteed. Combined with the kubelet's
          # static CPU manager policy and integer CPU requests, this gives the
          # pod exclusive whole cores: no CFS throttling and no thread
          # migration between cores, which is what makes saturation
          # measurements reproducible across the 5 repetitions.
          #
          # 40 of the node's 48 vCPUs. The kubelet reserves 4 (2 system + 2
          # kube), leaving 44 allocatable; 40 for the SUT leaves 4 for the
          # neighbors (argocd ~65m, redis ~61m, measured in Fase 0).
          # BENCH_CPUS in the ConfigMap must match the CPU value here.
          # See docs/ACTION_PLAN.md, Fase 0 and Fase 2.
          resources:
            requests:
              cpu: "40"
              memory: "40Gi"
            limits:
              cpu: "40"
              memory: "40Gi"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
