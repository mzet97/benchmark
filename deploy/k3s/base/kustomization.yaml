# deploy/k3s/base/kustomization.yaml
# Base Kustomize configuration for all benchmark implementations.
# Each overlay provides implementation-specific values.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: benchmark

commonLabels:
  app.kubernetes.io/part-of: benchmark
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - configmap.yaml
