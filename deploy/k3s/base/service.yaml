# Base Service template.
# Overlays must provide:
#   - IMPLEMENTATION_ID
#   - PORT

apiVersion: v1
kind: Service
metadata:
  name: PLACEHOLDER
  namespace: benchmark
  labels:
    app: PLACEHOLDER
    benchmark-role: server
spec:
  # NodePort, not ClusterIP: the load generator runs on the Windows
  # workstation, outside the cluster, because the cluster has a single node
  # and an in-cluster generator competes with the server for the same CPUs.
  # See docs/ACTION_PLAN.md, Fase 2.
  type: NodePort
  selector:
    app: PLACEHOLDER
  ports:
    - name: http
      port: 80
      targetPort: http
      # A fixed port is safe because the protocol runs exactly one
      # implementation at a time -- isolation is part of the methodology, and
      # it keeps the load generator's target URL constant across the run.
      nodePort: 30080
      protocol: TCP
