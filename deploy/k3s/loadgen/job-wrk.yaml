# wrk load generator Job for REST benchmarks.
# Runs inside the cluster to avoid network overhead from outside.
#
# Usage:
#   kubectl apply -f deploy/k3s/loadgen/job-wrk.yaml -n benchmark
#
# Parameters are passed via environment variables or ConfigMap.

apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-wrk
  namespace: benchmark
  labels:
    benchmark-role: loadgen
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        benchmark-role: loadgen
    spec:
      restartPolicy: Never
      nodeSelector:
        benchmark-role: loadgen
      containers:
        - name: wrk
          image: williamyeh/wrk:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "=== Benchmark Run ==="
              echo "Target: ${TARGET_URL}"
              echo "Duration: ${DURATION}s"
              echo "Threads: ${THREADS}"
              echo "Connections: ${CONNECTIONS}"
              echo "====================="

              # Warm-up
              echo "Warming up for 30s..."
              wrk -t${THREADS} -c${CONNECTIONS} -d30s ${TARGET_URL} > /dev/null 2>&1

              sleep 5

              # Measurement
              echo "Measuring for ${DURATION}s..."
              wrk -t${THREADS} -c${CONNECTIONS} -d${DURATION}s --latency ${TARGET_URL}
          env:
            - name: TARGET_URL
              value: "http://rust-rest-actix-web/health"
            - name: DURATION
              value: "60"
            - name: THREADS
              value: "4"
            - name: CONNECTIONS
              value: "200"
          resources:
            requests:
              cpu: "2"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
