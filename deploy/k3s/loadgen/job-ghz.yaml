# ghz load generator Job for gRPC benchmarks.
# Runs inside the cluster to avoid network overhead from outside.
#
# Usage:
#   kubectl apply -f deploy/k3s/loadgen/job-ghz.yaml -n benchmark

apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-ghz
  namespace: benchmark
  labels:
    benchmark-role: loadgen
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        benchmark-role: loadgen
    spec:
      restartPolicy: Never
      nodeSelector:
        benchmark-role: loadgen
      containers:
        - name: ghz
          image: ghcr.io/bojand/ghz:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "=== gRPC Benchmark Run ==="
              echo "Target: ${TARGET_HOST}:${TARGET_PORT}"
              echo "Duration: ${DURATION}s"
              echo "Connections: ${CONNECTIONS}"
              echo "Concurrency: ${CONCURRENCY}"
              echo "=========================="

              # Warm-up
              echo "Warming up for 30s..."
              ghz --insecure \
                --duration 30s \
                --connections ${CONNECTIONS} \
                --concurrency ${CONCURRENCY} \
                --call benchmark.BenchmarkService.Health \
                ${TARGET_HOST}:${TARGET_PORT} > /dev/null 2>&1

              sleep 5

              # Measurement
              echo "Measuring for ${DURATION}s..."
              ghz --insecure \
                --duration ${DURATION}s \
                --connections ${CONNECTIONS} \
                --concurrency ${CONCURRENCY} \
                --call benchmark.BenchmarkService.Health \
                --format json \
                ${TARGET_HOST}:${TARGET_PORT}
          env:
            - name: TARGET_HOST
              value: "rust-grpc-tonic"
            - name: TARGET_PORT
              value: "50051"
            - name: DURATION
              value: "60"
            - name: CONNECTIONS
              value: "10"
            - name: CONCURRENCY
              value: "50"
          resources:
            requests:
              cpu: "2"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
