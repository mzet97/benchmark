apiVersion: apps/v1
kind: Deployment
metadata:
  name: kotlin-ktor
  namespace: benchmark
  labels:
    app: kotlin-ktor
    tier: api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: kotlin-ktor
  template:
    metadata:
      labels:
        app: kotlin-ktor
        tier: api
    spec:
      containers:
      - name: api
        image: benchmark/kotlin-ktor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-url
        - name: DATABASE_USER
          value: "app"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-password
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: redis-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
