plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    application
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.http4k:http4k-core:5.21.0.0'
    implementation 'org.http4k:http4k-server-netty:5.21.0.0'
    implementation 'org.http4k:http4k-format-jackson:5.21.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
}

application {
    mainClass = 'com.benchmark.AppKt'
}
