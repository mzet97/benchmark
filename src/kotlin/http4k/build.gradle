plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.http4k:http4k-core:5.21.0.0'
    implementation 'org.http4k:http4k-server-netty:5.21.0.0'
    implementation 'org.http4k:http4k-format-jackson:5.21.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'

    // This project declared no data dependencies at all, which is why
    // /db/simple, /db/complex and /cache answered with literals. Versions match
    // src/kotlin/ktor so the two Kotlin implementations are compared on the
    // framework, not on their driver versions.
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'io.lettuce:lettuce-core:6.2.6.RELEASE'
}

application {
    mainClass = 'com.benchmark.AppKt'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.benchmark.AppKt'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
