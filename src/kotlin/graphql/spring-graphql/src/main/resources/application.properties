# Server
server.port=${PORT:8080}

# GraphQL
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false
spring.graphql.introspection.disabled=true

# PostgreSQL -- build the JDBC URL from the component ConfigMap variables so
# we avoid the missing "jdbc:" prefix in DATABASE_URL and sidestep the
# percent-encoded password in the URL string.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.url=${REDIS_URL}

# Logging
logging.level.root=WARN
logging.level.benchmark=INFO
