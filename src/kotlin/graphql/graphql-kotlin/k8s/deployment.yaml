apiVersion: apps/v1
kind: Deployment
metadata:
  name: kotlin-graphql-kotlin
  labels:
    app: kotlin-graphql-kotlin
    benchmark: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kotlin-graphql-kotlin
  template:
    metadata:
      labels:
        app: kotlin-graphql-kotlin
        benchmark: "true"
    spec:
      containers:
        - name: kotlin-graphql-kotlin
          image: benchmark/kotlin-graphql-kotlin:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: kotlin-graphql-kotlin-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
