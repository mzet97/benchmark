# Server
server.port=8080

# GraphQL
graphql.endpoint=/graphql
graphql.packages=benchmark
graphql.introspection.enabled=false
graphql.playground.enabled=false

# Database
database.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:benchmark}
database.username=${DB_USER:benchmark}
database.password=${DB_PASSWORD:benchmark}

# Redis
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}

# Logging
logging.level.root=WARN
logging.level.benchmark=INFO
