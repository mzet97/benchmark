spring.application.name=benchmark-grpc-kotlin-spring
server.port=${PORT:8080}

# gRPC
grpc.server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:benchmark}
spring.datasource.username=${DB_USER:benchmark}
spring.datasource.password=${DB_PASSWORD:benchmark}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Logging
logging.level.root=INFO
logging.level.benchmark=DEBUG
