# Ports, pool sizes and log level come from the shared ConfigMap
# (deploy/k3s/base/configmap.yaml) so they stop being per-implementation
# variables in the ranking. See docs/ACTION_PLAN.md, Fase 3.
server.port=${PORT:8080}
server.address=0.0.0.0

# DataSource (PostgreSQL). Build the JDBC URL from the component variables so
# we avoid the missing "jdbc:" prefix in DATABASE_URL and sidestep the
# percent-encoded password in the URL string. The ConfigMap exposes
# DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:32}
spring.datasource.hikari.minimum-idle=${DB_POOL_MAX:32}

spring.data.redis.url=${REDIS_URL}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX:32}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX:32}

logging.level.root=${LOG_LEVEL:ERROR}
