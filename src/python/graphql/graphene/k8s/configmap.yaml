apiVersion: v1
kind: ConfigMap
metadata:
  name: graphql-python-graphene-config
  labels:
    app: graphql-python-graphene
    benchmark: "true"
data:
  PORT: "8080"
  DATABASE_URL: "postgres://benchmark:benchmark@postgresql.benchmark.svc.cluster.local:5432/benchmark"
  REDIS_URL: "redis://redis.benchmark.svc.cluster.local:6379"
