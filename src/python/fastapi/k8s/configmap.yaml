apiVersion: v1
kind: ConfigMap
metadata:
  name: python-fastapi-config
  labels:
    app: python-fastapi
data:
  # Application settings
  app.name: "Benchmark API - Python FastAPI"
  app.version: "1.0.0"
  app.debug: "false"
  app.log_level: "INFO"

  # Server settings
  server.port: "8000"
  server.host: "0.0.0.0"
  server.workers: "1"

  # Database settings
  database.pool_min: "5"
  database.pool_max: "25"
  database.timeout: "30"

  # Cache settings
  cache.ttl: "300"
  cache.timeout: "5"

  # Middleware settings
  middleware.cors.enabled: "true"
  middleware.trusted_hosts.enabled: "true"
