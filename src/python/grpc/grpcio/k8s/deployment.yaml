apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-grpc-grpcio
  labels:
    app: python-grpc-grpcio
    component: benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-grpc-grpcio
  template:
    metadata:
      labels:
        app: python-grpc-grpcio
        component: benchmark
    spec:
      containers:
        - name: server
          image: benchmark/python-grpc-grpcio:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: python-grpc-grpcio-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: benchmark-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: benchmark-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
