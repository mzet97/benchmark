apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-nice-grpc
  labels:
    app: benchmark-nice-grpc
    component: grpc-server
    benchmark: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-nice-grpc
  template:
    metadata:
      labels:
        app: benchmark-nice-grpc
        component: grpc-server
        benchmark: "true"
    spec:
      containers:
        - name: nice-grpc
          image: benchmark/nice-grpc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: benchmark-nice-grpc-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
