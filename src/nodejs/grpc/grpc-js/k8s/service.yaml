apiVersion: v1
kind: Service
metadata:
  name: benchmark-grpc-js
  labels:
    app: benchmark-grpc-js
    component: grpc-server
    benchmark: "true"
spec:
  type: ClusterIP
  selector:
    app: benchmark-grpc-js
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
