apiVersion: v1
kind: Service
metadata:
  name: nodejs-express
  labels:
    app: nodejs-express
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: nodejs-express
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-express-headless
  labels:
    app: nodejs-express
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: nodejs-express
