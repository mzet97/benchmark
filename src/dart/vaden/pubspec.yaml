name: benchmark_dart_vaden
description: High-performance REST API benchmark using Dart with Vaden framework
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  vaden: ^0.1.0
  dart_frog: ^1.5.0
  postgres: ^2.2.0
  redis: ^5.0.0
  jaguar_jwt: ^3.0.0
  envied: ^0.5.0
  logging: ^1.2.0
  json_annotation: ^4.8.0

dev_dependencies:
  lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  envied_generator: ^0.5.0
  test: ^1.24.0

executables:
  server:
    template: bin/server.dart
