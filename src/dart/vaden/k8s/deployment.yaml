apiVersion: apps/v1
kind: Deployment
metadata:
  name: dart-vaden
  labels:
    app: dart-vaden
    version: v1
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dart-vaden
  template:
    metadata:
      labels:
        app: dart-vaden
        version: v1
    spec:
      containers:
      - name: api
        image: benchmark/dart-vaden:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: redis-url
        - name: DEBUG
          value: "false"
        - name: LOG_LEVEL
          value: "info"
        - name: PORT
          value: "3000"
        - name: HOST
          value: "0.0.0.0"
        - name: DB_POOL_MIN
          value: "5"
        - name: DB_POOL_MAX
          value: "25"
        - name: DB_TIMEOUT
          value: "30"
        - name: CACHE_TTL
          value: "300"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
