apiVersion: v1
kind: ConfigMap
metadata:
  name: dart-vaden-config
  labels:
    app: dart-vaden
data:
  # Application settings
  app.name: "Benchmark API - Dart Vaden"
  app.version: "1.0.0"
  app.debug: "false"
  app.log_level: "info"

  # Server settings
  server.port: "3000"
  server.host: "0.0.0.0"

  # Database settings
  database.pool_min: "5"
  database.pool_max: "25"
  database.timeout: "30"

  # Cache settings
  cache.ttl: "300"

  # Runtime settings
  runtime.dart: "3.0+"
  framework.vaden: "latest"
