apiVersion: v1
kind: Service
metadata:
  name: dart-vaden
  labels:
    app: dart-vaden
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: dart-vaden
---
apiVersion: v1
kind: Service
metadata:
  name: dart-vaden-headless
  labels:
    app: dart-vaden
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: dart-vaden
