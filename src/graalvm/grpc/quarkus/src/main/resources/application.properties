# gRPC server configuration
quarkus.grpc.server.port=${PORT:8080}
quarkus.grpc.server.use-separate-server=false

# PostgreSQL reactive configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/benchmark
quarkus.datasource.username=benchmark
quarkus.datasource.password=benchmark

# Redis configuration
quarkus.redis.hosts=redis://localhost:6379

# Native image configuration
quarkus.native.resources.includes=benchmark.proto

# Health and metrics
quarkus.health.enabled=true
quarkus.native.monitoring=heapdump

# Logging
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
