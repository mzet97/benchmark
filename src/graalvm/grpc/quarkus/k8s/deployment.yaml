apiVersion: apps/v1
kind: Deployment
metadata:
  name: graalvm-grpc-quarkus
  labels:
    app: graalvm-grpc-quarkus
    benchmark: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graalvm-grpc-quarkus
  template:
    metadata:
      labels:
        app: graalvm-grpc-quarkus
        benchmark: "true"
    spec:
      containers:
        - name: graalvm-grpc-quarkus
          image: benchmark/graalvm-grpc-quarkus:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: graalvm-grpc-quarkus-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
