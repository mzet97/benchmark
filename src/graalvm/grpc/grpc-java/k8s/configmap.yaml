apiVersion: v1
kind: ConfigMap
metadata:
  name: graalvm-grpc-java-config
  labels:
    app: graalvm-grpc-java
data:
  # Application settings
  app.name: "Benchmark gRPC - GraalVM grpc-java"
  app.version: "1.0.0"

  # gRPC server settings
  port: "3000"

  # Database settings
  database.pool.min: "5"
  database.pool.max: "25"

  # Cache settings
  cache.ttl: "300"
