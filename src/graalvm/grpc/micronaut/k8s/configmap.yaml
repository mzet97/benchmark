apiVersion: v1
kind: ConfigMap
metadata:
  name: graalvm-micronaut-grpc-config
  labels:
    app: graalvm-micronaut-grpc
data:
  # Application settings
  app.name: "Benchmark gRPC - GraalVM Micronaut"
  app.version: "1.0.0"

  # gRPC server settings
  grpc.server.port: "3000"

  # Database settings
  database.pool.min: "5"
  database.pool.max: "25"

  # Cache settings
  cache.ttl: "300"
