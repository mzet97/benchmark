apiVersion: apps/v1
kind: Deployment
metadata:
  name: graalvm-micronaut-grpc
  labels:
    app: graalvm-micronaut-grpc
    version: v1
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: graalvm-micronaut-grpc
  template:
    metadata:
      labels:
        app: graalvm-micronaut-grpc
        version: v1
    spec:
      containers:
      - name: api
        image: benchmark/graalvm-micronaut-grpc:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: grpc
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-url
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-password
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: redis-url
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          grpc:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
