# Ports, pool sizes and log level come from the shared ConfigMap
# (deploy/k3s/base/configmap.yaml) so they stop being per-implementation
# variables in the ranking. See docs/ACTION_PLAN.md, Fase 3.
micronaut:
  application:
    name: graalvm-micronaut
  server:
    port: ${PORT:8080}
    host: 0.0.0.0

# No `datasources:` block here. The deploy only exposes DATABASE_URL
# (postgresql://...) via the benchmark-secrets; the DB_HOST/DB_PORT/DB_NAME/
# DB_USER variables referenced here previously do not exist, so Micronaut
# could not resolve the placeholders and the DataSource bean failed to build
# ("Failed to inject value for parameter [dataSource]"). The DataSource is now
# produced by com.benchmark.config.DatasourceFactory, which parses DATABASE_URL
# directly. Keep micronaut-jdbc-hikari on the classpath so the DataSource/SQL
# type converters and @JdbcRepository support are still registered.
redis:
  uri: ${REDIS_URL}
  pool:
    enabled: true
    max-total: ${REDIS_POOL_MAX:32}

jackson:
  serialization:
    writeDatesAsTimestamps: false

logger:
  levels:
    root: ${LOG_LEVEL:ERROR}
