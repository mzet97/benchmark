# Ports, pool sizes and log level come from the shared ConfigMap
# (deploy/k3s/base/configmap.yaml) so they stop being per-implementation
# variables in the ranking. See docs/ACTION_PLAN.md, Fase 3.
micronaut:
  application:
    name: graalvm-micronaut
  server:
    port: ${PORT:8080}
    host: 0.0.0.0

datasources:
  default:
    driver-class-name: org.postgresql.Driver
    # Build the JDBC URL from the component ConfigMap variables so we avoid the
    # missing "jdbc:" prefix in DATABASE_URL and sidestep the percent-encoded
    # password in the URL string. The ConfigMap exposes
    # DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    maximum-pool-size: ${DB_POOL_MAX:32}
    minimum-idle: ${DB_POOL_MAX:32}

redis:
  uri: ${REDIS_URL}
  pool:
    enabled: true
    max-total: ${REDIS_POOL_MAX:32}

jackson:
  serialization:
    writeDatesAsTimestamps: false

logger:
  levels:
    root: ${LOG_LEVEL:ERROR}
