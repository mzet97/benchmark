# Ports, pool sizes and log level come from the shared ConfigMap
# (deploy/k3s/base/configmap.yaml) so they stop being per-implementation
# variables in the ranking. See docs/ACTION_PLAN.md, Fase 3.
micronaut:
  application:
    name: graalvm-micronaut
  server:
    port: ${PORT:8080}
    host: 0.0.0.0

datasources:
  default:
    driver-class-name: org.postgresql.Driver
    # No default: a missing DATABASE_URL must abort startup, not silently
    # point the benchmark at localhost.
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    maximum-pool-size: ${DB_POOL_MAX:32}
    minimum-idle: ${DB_POOL_MAX:32}

redis:
  uri: ${REDIS_URL}
  pool:
    enabled: true
    max-total: ${REDIS_POOL_MAX:32}

jackson:
  serialization:
    writeDatesAsTimestamps: false

logger:
  levels:
    root: ${LOG_LEVEL:ERROR}
