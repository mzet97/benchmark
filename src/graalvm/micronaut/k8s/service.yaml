apiVersion: v1
kind: Service
metadata:
  name: graalvm-micronaut
  labels:
    app: graalvm-micronaut
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: graalvm-micronaut
---
apiVersion: v1
kind: Service
metadata:
  name: graalvm-micronaut-headless
  labels:
    app: graalvm-micronaut
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: graalvm-micronaut
