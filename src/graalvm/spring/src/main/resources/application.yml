server:
  port: 3000
  host: 0.0.0.0

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/benchmark_api}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: INFO
