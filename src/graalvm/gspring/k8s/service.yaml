apiVersion: v1
kind: Service
metadata:
  name: graalvm-gspring
  labels:
    app: graalvm-gspring
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: graalvm-gspring
---
apiVersion: v1
kind: Service
metadata:
  name: graalvm-gspring-headless
  labels:
    app: graalvm-gspring
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: graalvm-gspring
