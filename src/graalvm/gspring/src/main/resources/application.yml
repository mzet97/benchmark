# Ports, pool sizes and log level come from the shared ConfigMap
# (deploy/k3s/base/configmap.yaml) so they stop being per-implementation
# variables in the ranking. See docs/ACTION_PLAN.md, Fase 3.
server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  datasource:
    # DataSource (PostgreSQL). Build the JDBC URL from the component variables
    # so we avoid the missing "jdbc:" prefix in DATABASE_URL and sidestep the
    # percent-encoded password in the URL string. The ConfigMap exposes
    # DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:32}
      minimum-idle: ${DB_POOL_MAX:32}
  data:
    redis:
      url: ${REDIS_URL}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:32}
          max-idle: ${REDIS_POOL_MAX:32}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: ${LOG_LEVEL:ERROR}
