# Server
server.port=8080

# GraphQL
spring.graphql.graphiql.enabled=false
spring.graphql.path=/graphql

# Database -- read by DatabaseService via @Value. Build the JDBC URL from the
# component ConfigMap variables so we avoid the missing "jdbc:" prefix in
# DATABASE_URL and sidestep the percent-encoded password in the URL string.
database.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
database.username=${DB_USER}
database.password=${DB_PASSWORD}

# Redis
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}

# Logging
logging.level.root=WARN
logging.level.benchmark=INFO
