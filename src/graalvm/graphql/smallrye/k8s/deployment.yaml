apiVersion: apps/v1
kind: Deployment
metadata:
  name: smallrye-graphql
  labels:
    app: smallrye-graphql
    benchmark: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smallrye-graphql
  template:
    metadata:
      labels:
        app: smallrye-graphql
        benchmark: "true"
    spec:
      containers:
        - name: smallrye-graphql
          image: benchmark/smallrye-graphql-native:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: smallrye-graphql-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /q/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
