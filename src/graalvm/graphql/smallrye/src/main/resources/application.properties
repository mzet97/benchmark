# Quarkus
quarkus.http.port=8080

# GraphQL
quarkus.smallrye-graphql.ui.enable=false
quarkus.smallrye-graphql.print-data-fetcher-exception=false

# Database -- build the JDBC URL from the component ConfigMap variables so we
# avoid the missing "jdbc:" prefix in DATABASE_URL and sidestep the
# percent-encoded password in the URL string.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20

# Redis
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
quarkus.redis.max-pool-size=16
quarkus.redis.max-pool-waiting=0

# Logging
quarkus.log.level=WARN
quarkus.log.category."benchmark".level=INFO

# Native
quarkus.native.resources.includes=graphql/**
