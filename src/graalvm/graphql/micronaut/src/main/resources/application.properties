# Server
micronaut.server.port=8080

# GraphQL
graphql.enabled=true
graphql.path=/graphql

# Database
database.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:benchmark}
database.username=${DB_USER:benchmark}
database.password=${DB_PASSWORD:benchmark}

# Redis
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}

# Logging
logger.levels.benchmark=INFO
