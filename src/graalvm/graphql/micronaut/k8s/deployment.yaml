apiVersion: apps/v1
kind: Deployment
metadata:
  name: micronaut-graphql-native
  labels:
    app: micronaut-graphql-native
    benchmark: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micronaut-graphql-native
  template:
    metadata:
      labels:
        app: micronaut-graphql-native
        benchmark: "true"
    spec:
      containers:
        - name: micronaut-graphql-native
          image: benchmark/micronaut-graphql-native:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: micronaut-graphql-native-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
