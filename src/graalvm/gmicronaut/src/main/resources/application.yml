# Ports, pool sizes and log level come from the shared ConfigMap
# (deploy/k3s/base/configmap.yaml) so they stop being per-implementation
# variables in the ranking. See docs/ACTION_PLAN.md, Fase 3.
micronaut:
  application:
    name: graalvm-micronaut-native
  server:
    port: ${PORT:8080}
    host: 0.0.0.0

# No `datasources:` block here. The deploy only exposes DATABASE_URL
# (postgresql://...) via benchmark-secrets; DB_USERNAME/DB_PASSWORD are not
# provided, so the previous `datasources.default.url/username/password`
# placeholders could not resolve and the DataSource bean failed to build.
# The DataSource is now produced by com.benchmark.config.DatasourceFactory,
# which parses DATABASE_URL directly (and adds the missing jdbc: prefix).
# micronaut-jdbc-hikari stays on the classpath for the DataSource/SQL type
# converters that micronaut-data-jdbc relies on.

redis:
  uri: ${REDIS_URL}
  pool:
    enabled: true
    max-total: ${REDIS_POOL_MAX:32}

jackson:
  serialization:
    writeDatesAsTimestamps: false

logger:
  levels:
    root: ${LOG_LEVEL:ERROR}
