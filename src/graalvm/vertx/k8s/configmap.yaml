apiVersion: v1
kind: ConfigMap
metadata:
  name: graalvm-vertx-config
  labels:
    app: graalvm-vertx
data:
  # Application settings
  app.name: "Benchmark API - GraalVM Vert.x"
  app.version: "1.0.0"
  app.debug: "false"
  app.log_level: "info"

  # Server settings
  server.port: "3000"
  server.host: "0.0.0.0"

  # Database settings
  database.pool_min: "5"
  database.pool_max: "25"

  # Cache settings
  cache.ttl: "300"

  # Runtime settings
  runtime.graalvm: "21.0+"
  framework.vertx: "4.5+"
