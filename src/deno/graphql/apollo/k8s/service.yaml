apiVersion: v1
kind: Service
metadata:
  name: deno-graphql-apollo
  labels:
    app: deno-graphql-apollo
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: deno-graphql-apollo
---
apiVersion: v1
kind: Service
metadata:
  name: deno-graphql-apollo-headless
  labels:
    app: deno-graphql-apollo
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: deno-graphql-apollo
