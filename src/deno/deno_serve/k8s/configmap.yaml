apiVersion: v1
kind: ConfigMap
metadata:
  name: deno-deno-serve-config
  labels:
    app: deno-deno-serve
data:
  app.name: "Benchmark API - Deno Native Serve"
  app.version: "1.0.0"
  app.debug: "false"
  app.log_level: "info"
  server.port: "3000"
  server.host: "0.0.0.0"
  database.pool_min: "5"
  database.pool_max: "25"
  cache.ttl: "300"
