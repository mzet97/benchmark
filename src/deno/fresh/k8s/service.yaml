apiVersion: v1
kind: Service
metadata:
  name: deno-fresh
  labels:
    app: deno-fresh
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: deno-fresh
---
apiVersion: v1
kind: Service
metadata:
  name: deno-fresh-headless
  labels:
    app: deno-fresh
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: deno-fresh
