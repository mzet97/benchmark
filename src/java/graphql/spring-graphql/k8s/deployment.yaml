apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-graphql
  labels:
    app: spring-graphql
    benchmark: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-graphql
  template:
    metadata:
      labels:
        app: spring-graphql
        benchmark: "true"
    spec:
      containers:
        - name: spring-graphql
          image: benchmark/spring-graphql:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: spring-graphql-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
