# Spring Boot does not map the benchmark's DATABASE_URL / DB_* / REDIS_URL
# environment variables onto its own spring.datasource.* / spring.data.redis.*
# properties. With spring-boot-starter-jdbc on the classpath the DataSource
# auto-configuration therefore starts, finds no JDBC URL, and aborts at startup
# with "Failed to determine a suitable driver class". These placeholders wire
# the Secret-provided variables to the properties Spring actually reads.

# DataSource (PostgreSQL). Build the JDBC URL from the component variables so
# we avoid the missing "jdbc:" prefix in DATABASE_URL and sidestep the
# percent-encoded password in the URL string.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool size is part of the benchmark contract (DB_POOL_MAX), not a default.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:32}

# Redis. REDIS_URL is the canonical secret; map it to the property Spring Boot's
# Redis auto-configuration reads. Lettuce decodes the percent-encoded password.
spring.data.redis.url=${REDIS_URL}
