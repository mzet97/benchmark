apiVersion: v1
kind: Service
metadata:
  name: java-spring
  labels:
    app: java-spring
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: java-spring
---
apiVersion: v1
kind: Service
metadata:
  name: java-spring-headless
  labels:
    app: java-spring
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: java-spring
