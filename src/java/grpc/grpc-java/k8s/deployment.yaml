apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-java-grpc-java
  labels:
    app: benchmark-java-grpc-java
    runtime: java
    framework: grpc-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-java-grpc-java
  template:
    metadata:
      labels:
        app: benchmark-java-grpc-java
        runtime: java
        framework: grpc-java
    spec:
      containers:
        - name: server
          image: benchmark-java-grpc-java:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: benchmark-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 30
