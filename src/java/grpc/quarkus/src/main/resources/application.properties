# Quarkus gRPC
quarkus.grpc.server.port=50051
quarkus.grpc.server.enable-reflection-service=true

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:benchmark}
quarkus.datasource.password=${DB_PASSWORD:benchmark}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:benchmark}

# Reactive PostgreSQL Client
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:benchmark}

# Redis
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# Logging
quarkus.log.level=INFO
quarkus.log.category."benchmark".level=DEBUG

# HTTP (for health endpoint)
quarkus.http.port=8080
