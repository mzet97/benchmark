# Ports, pool sizes and log level come from the shared ConfigMap
# (deploy/k3s/base/configmap.yaml) so they stop being per-implementation
# variables in the ranking. See docs/ACTION_PLAN.md, Fase 3.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# DataSource (PostgreSQL) via the Vert.x reactive PG client. The reactive
# client uses a "postgresql://host:port/db" URL (no "jdbc:" prefix). Build it
# from the component ConfigMap variables to sidestep the percent-encoded
# password in the DATABASE_URL string. The ConfigMap exposes
# DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.reactive.max-size=${DB_POOL_MAX:32}

quarkus.redis.hosts=${REDIS_URL}
quarkus.redis.max-pool-size=${REDIS_POOL_MAX:32}
quarkus.redis.timeout=5s
quarkus.redis.reconnect-retry-interval=3s
quarkus.redis.client-type=STANDALONE

quarkus.health.extensions.enabled=true

quarkus.log.level=${LOG_LEVEL:ERROR}
quarkus.log.console.json=false

quarkus.native.additional-build-args=-H:+ReportExceptionStackTraces,-H:HeapDumpPath=/tmp/dump
quarkus.native.enabled=false
quarkus.package.jar.type=uber-jar
