# Server Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Database Configuration (PostgreSQL)
quarkus.datasource.reactive.url=postgresql://spsql.home.arpa:5432/benchmark_api
quarkus.datasource.reactive.username=app
quarkus.datasource.reactive.password=Admin@123
quarkus.datasource.reactive.max-size=25
quarkus.datasource.reactive.min-size=5

# Redis Configuration
quarkus.redis.hosts=spsql.home.arpa:30379
quarkus.redis.password=Admin@123
quarkus.redis.timeout=5s
quarkus.redis.reconnect-retry-interval=3s
quarkus.redis.client-type=STANDALONE

# Health Checks
quarkus.health.extensions.enabled=true

# Logging
quarkus.log.level=INFO
quarkus.log.console.json=false
quarkus.log.category."org.slf4j".level=INFO
quarkus.log.category."com.benchmark.api".level=INFO

# Dev mode settings (can be overridden by environment)
%dev.quarkus.datasource.reactive.url=postgresql://app:Admin@123@spsql.home.arpa:5432/benchmark_api
%prod.quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://app:Admin@123@spsql.home.arpa:5432/benchmark_api}
%prod.quarkus.redis.hosts=${REDIS_HOST:redis.home.arpa:30379}
%prod.quarkus.redis.password=${REDIS_PASSWORD:Admin@123}

# Native Image specific settings
quarkus.native.enabled=true
quarkus.native.additional-build-args=-H:+ReportExceptionStackTraces,-H:HeapDumpPath=/tmp/dump
