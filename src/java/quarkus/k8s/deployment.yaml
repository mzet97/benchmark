apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-quarkus
  namespace: benchmark
  labels:
    app: java-quarkus
    tier: api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: java-quarkus
  template:
    metadata:
      labels:
        app: java-quarkus
        tier: api
    spec:
      containers:
      - name: api
        image: benchmark/java-quarkus:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-url
        - name: REDIS_HOST
          value: "redis.home.arpa:30379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: redis-password
        - name: QUARKUS_HTTP_PORT
          value: "8080"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
