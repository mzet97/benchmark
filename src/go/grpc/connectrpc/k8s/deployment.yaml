apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-connectrpc
  labels:
    app: benchmark-connectrpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-connectrpc
  template:
    metadata:
      labels:
        app: benchmark-connectrpc
    spec:
      containers:
        - name: server
          image: benchmark-connectrpc:latest
          ports:
            - containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: benchmark-connectrpc-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /grpc.health.v1.Health/Check
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /grpc.health.v1.Health/Check
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
