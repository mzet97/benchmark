apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-kitex
  labels:
    app: benchmark-kitex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-kitex
  template:
    metadata:
      labels:
        app: benchmark-kitex
    spec:
      containers:
        - name: server
          image: benchmark-kitex:latest
          ports:
            - containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: benchmark-kitex-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
