apiVersion: v1
kind: Service
metadata:
  name: go-gin
  labels:
    app: go-gin
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: go-gin
---
apiVersion: v1
kind: Service
metadata:
  name: go-gin-headless
  labels:
    app: go-gin
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: go-gin
