apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-graphql-go
  labels:
    app: graphql-graphql-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphql-graphql-go
  template:
    metadata:
      labels:
        app: graphql-graphql-go
    spec:
      containers:
        - name: server
          image: graphql-graphql-go:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: graphql-graphql-go-config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /graphql
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /graphql
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
