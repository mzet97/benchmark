apiVersion: v1
kind: Service
metadata:
  name: go-echo
  labels:
    app: go-echo
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: go-echo
---
apiVersion: v1
kind: Service
metadata:
  name: go-echo-headless
  labels:
    app: go-echo
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: go-echo
