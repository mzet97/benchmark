apiVersion: v1
kind: Service
metadata:
  name: bun-graphql-yoga
  labels:
    app: bun-graphql-yoga
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: bun-graphql-yoga
---
apiVersion: v1
kind: Service
metadata:
  name: bun-graphql-yoga-headless
  labels:
    app: bun-graphql-yoga
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: bun-graphql-yoga
