apiVersion: v1
kind: ConfigMap
metadata:
  name: bun-graphql-yoga-config
  labels:
    app: bun-graphql-yoga
data:
  app.name: "Benchmark GraphQL API - Bun Yoga"
  app.version: "1.0.0"
  server.port: "3000"
  server.host: "0.0.0.0"
  database.pool_min: "5"
  database.pool_max: "25"
  cache.ttl: "300"
