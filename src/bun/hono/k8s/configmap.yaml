apiVersion: v1
kind: ConfigMap
metadata:
  name: bun-hono-config
  labels:
    app: bun-hono
data:
  # Application settings
  app.name: "Benchmark API - bun hono"
  app.version: "1.0.0"
  app.debug: "false"
  app.log_level: "info"

  # Server settings
  server.port: "3000"
  server.host: "0.0.0.0"

  # Database settings
  database.pool_min: "5"
  database.pool_max: "25"

  # Cache settings
  cache.ttl: "300"
