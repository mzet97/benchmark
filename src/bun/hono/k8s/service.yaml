apiVersion: v1
kind: Service
metadata:
  name: bun-hono
  labels:
    app: bun-hono
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: bun-hono
---
apiVersion: v1
kind: Service
metadata:
  name: bun-hono-headless
  labels:
    app: bun-hono
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: bun-hono
