apiVersion: v1
kind: ConfigMap
metadata:
  name: bun-elysia-config
  labels:
    app: bun-elysia
data:
  # Application settings
  app.name: "Benchmark API - Bun Elysia"
  app.version: "1.0.0"
  app.debug: "false"
  app.log_level: "info"

  # Server settings
  server.port: "3000"
  server.host: "0.0.0.0"

  # Database settings
  database.pool_min: "5"
  database.pool_max: "25"
  database.timeout: "10000"
  database.idle_timeout: "30000"

  # Cache settings
  cache.ttl: "300"

  # Runtime settings
  runtime.bun: "1.0+"
  framework.elysia: "latest"
