apiVersion: v1
kind: Service
metadata:
  name: bun-elysia
  labels:
    app: bun-elysia
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: bun-elysia
---
apiVersion: v1
kind: Service
metadata:
  name: bun-elysia-headless
  labels:
    app: bun-elysia
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: bun-elysia
