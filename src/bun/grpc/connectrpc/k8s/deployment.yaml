apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-bun-connectrpc
  labels:
    app: benchmark-bun-connectrpc
    runtime: bun
    framework: connectrpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-bun-connectrpc
  template:
    metadata:
      labels:
        app: benchmark-bun-connectrpc
        runtime: bun
        framework: connectrpc
    spec:
      containers:
        - name: server
          image: benchmark-bun-connectrpc:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: benchmark-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
