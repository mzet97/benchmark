apiVersion: apps/v1
kind: Deployment
metadata:
  name: csharp-protobuf-net-grpc
  labels:
    app: csharp-protobuf-net-grpc
    benchmark: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csharp-protobuf-net-grpc
  template:
    metadata:
      labels:
        app: csharp-protobuf-net-grpc
        benchmark: "true"
    spec:
      containers:
        - name: csharp-protobuf-net-grpc
          image: benchmark/csharp-protobuf-net-grpc:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: csharp-protobuf-net-grpc-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
