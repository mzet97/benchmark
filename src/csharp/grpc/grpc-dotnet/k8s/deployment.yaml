apiVersion: apps/v1
kind: Deployment
metadata:
  name: csharp-grpc-dotnet
  labels:
    app: csharp-grpc-dotnet
    benchmark: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csharp-grpc-dotnet
  template:
    metadata:
      labels:
        app: csharp-grpc-dotnet
        benchmark: "true"
    spec:
      containers:
        - name: csharp-grpc-dotnet
          image: benchmark/csharp-grpc-dotnet:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: csharp-grpc-dotnet-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
