apiVersion: v1
kind: ConfigMap
metadata:
  name: csharp-fastendpoints-config
  namespace: benchmark
  labels:
    app: csharp-fastendpoints
data:
  database.url: "Host=spsql.home.arpa;Port=5432;Database=benchmark_api;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=25;Connection Timeout=30;"
  redis.url: "redis.home.arpa:30379,Password=${DB_PASSWORD},defaultDatabase=0,ssl=false"
---
apiVersion: v1
kind: Secret
metadata:
  name: benchmark-secrets
  namespace: benchmark
  labels:
    app: csharp-fastendpoints
type: Opaque
stringData:
  database-url: "postgresql://app:${DB_PASSWORD}@spsql.home.arpa:5432/benchmark_api"
  redis-url: "redis://:${REDIS_PASSWORD}@redis.home.arpa:30379"
  database-password: ${DB_PASSWORD}
  redis-password: ${DB_PASSWORD}
