apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-hotchocolate
  labels:
    app: graphql-hotchocolate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphql-hotchocolate
  template:
    metadata:
      labels:
        app: graphql-hotchocolate
    spec:
      containers:
        - name: graphql-hotchocolate
          image: graphql-hotchocolate:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: graphql-hotchocolate-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
