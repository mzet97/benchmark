apiVersion: v1
kind: ConfigMap
metadata:
  name: csharp-controllers-config
  namespace: benchmark
  labels:
    app: csharp-controllers
data:
  database.url: "Host=spsql.home.arpa;Port=5432;Database=benchmark_api;Username=app;Password=Admin@123;Maximum Pool Size=25;Connection Timeout=30;"
