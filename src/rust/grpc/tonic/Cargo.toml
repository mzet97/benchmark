[package]
name = "benchmark-grpc-tonic"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
postgres-types = { version = "0.2", features = ["with-uuid-1"] }
redis = { version = "0.26", features = ["tokio-comp"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"
