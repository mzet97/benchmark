apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-grpc-volo
  labels:
    app: benchmark-grpc-volo
    runtime: rust
    framework: volo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-grpc-volo
  template:
    metadata:
      labels:
        app: benchmark-grpc-volo
        runtime: rust
        framework: volo
    spec:
      containers:
        - name: server
          image: benchmark-grpc-volo:latest
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: benchmark-config
            - secretRef:
                name: benchmark-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
