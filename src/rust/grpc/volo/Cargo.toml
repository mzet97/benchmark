[package]
name = "benchmark-grpc-volo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
volo = "0.10"
volo-grpc = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
postgres-types = { version = "0.2", features = ["with-uuid-1"] }
redis = { version = "0.26", features = ["tokio-comp"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
pilota = "0.11"

[build-dependencies]
volo-build = "0.10"
