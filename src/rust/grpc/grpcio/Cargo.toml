[package]
name = "benchmark-grpc-grpcio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
grpcio = { version = "0.13", features = ["openssl"] }
protobuf = "3.5"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
postgres-types = { version = "0.2", features = ["with-uuid-1"] }
redis = { version = "0.26", features = ["tokio-comp"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[build-dependencies]
protoc-grpcio = "3.0"
protobuf-codegen = "3.5"
