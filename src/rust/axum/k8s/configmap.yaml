apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-axum-config
  labels:
    app: rust-axum
data:
  # Application settings
  app.name: "Benchmark API - Rust Axum"
  app.version: "1.0.0"
  app.debug: "false"
  app.log_level: "info"

  # Server settings
  server.port: "3000"
  server.host: "0.0.0.0"

  # Database settings
  database.pool_min: "5"
  database.pool_max: "25"

  # Cache settings
  cache.ttl: "300"

  # Rust settings
  rust.log_level: "info"
