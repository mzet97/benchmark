apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-actix-web
  namespace: benchmark
  labels:
    app: rust-actix-web
    tier: api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: rust-actix-web
  template:
    metadata:
      labels:
        app: rust-actix-web
        tier: api
    spec:
      containers:
      - name: api
        image: benchmark/rust-actix-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: redis-url
        - name: SERVER_BIND
          value: "0.0.0.0:8080"
        - name: SERVER_WORKERS
          value: "4"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
