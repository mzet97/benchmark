apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-rocket
  labels:
    app: rust-rocket
spec:
  replicas: 5
  selector:
    matchLabels:
      app: rust-rocket
  template:
    metadata:
      labels:
        app: rust-rocket
    spec:
      containers:
      - name: api
        image: benchmark/rust-rocket:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: benchmark-secrets
              key: redis-url
        - name: ROCKET_PORT
          value: "3000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
